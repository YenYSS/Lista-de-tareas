<!DOCTYPE html>
<html>
<head>
    <title>Gestor de Tareas</title>
    <link rel="stylesheet" href="static/css/styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
</head>
<body>
<header class="header">

    <div class="header-left">

        <div class="logo-box">
            ✔
        </div>

        <div class="title-container">
            <h1>TaskFlow</h1>
            <span id="task-count">0 tareas</span>
        </div>

    </div>

    <div class="header-right">
        <button class="btn-new-task">+ Nueva tarea</button>
    </div>

</header>

<div class="app-container">
    <aside class="sidebar">
        
        <div class="calendar-section">
            <div id="mini-calendar">
                <div class="calendar-header">
                    <button id="prev-month">←</button>
                    <span id="calendar-title"></span>
                    <button id="next-month">→</button>
                </div>

                <div class="calendar-days">
                    <span>Lun</span><span>Mar</span><span>Mié</span>
                    <span>Jue</span><span>Vie</span><span>Sab</span><span>Dom</span>
                </div>

                <div class="calendar-grid" id="calendar-grid"></div>

            </div>
        </div>

        <div class="folders-section">
            <h3>Carpetas</h3>

            <ul id="folder-list">
                <li class="folder-item active" onclick="seleccionarCarpeta('Todas', this)">
                    <span class="folder-icon">📁</span>
                    <span class="folder-name">Todas</span>
                </li>
            </ul>

            <button class="btn-add-folder">+ Nueva carpeta</button>
        </div>

    </aside>

    <section class="tasks-section">
        <div id="filters-info" class="filters-info"></div>

        <div class="tasks-container" id="tasks-container"></div>
    </section>

</div>

<div class="modal-overlay" id="modalNuevaTarea">

    <div class="modal">

        <div class="modal-header">
            <div>
                <h2 id="modalTitle">Nueva Tarea</h2>
                <p id="modalDesc">Completa los campos para crear una nueva tarea.</p>
            </div>

            <button class="modal-close" id="cerrarModal">✕</button>
        </div>

        <form id="formNuevaTarea">

            <div class="form-group">
                <label>Nombre de la tarea</label>
                <input type="text" id="titulo" placeholder="Ej: Revisar documentación">
                <small id="error-titulo" class="error"></small>
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <textarea id="descripcion" placeholder="Describe los detalles de la tarea..."></textarea>
                <small id="error-descripcion" class="error"></small>
            </div>


            <div class="form-group">
                <label>Estado</label>
                <select id="estado">
                    <option value="pendiente">Pendiente</option>
                    <option value="en progreso">En progreso</option>
                    <option value="completada">Completada</option>
                </select>
            </div>

            <div class="form-group">
                <label>Etiqueta</label>

                <div class="color-container">
                    
                    <div class="color-options">
                        <button type="button" class="color-btn azul" data-color="azul" data-nombre="Hogar"></button>
                        <button type="button" class="color-btn rojo" data-color="rojo" data-nombre="Urgente"></button>
                        <button type="button" class="color-btn verde" data-color="verde" data-nombre="Trabajo"></button>
                        <button type="button" class="color-btn amarillo" data-color="amarillo" data-nombre="Estudio"></button>
                        <button type="button" class="color-btn morado" data-color="morado" data-nombre="Personal"></button>
                        <button type="button" class="color-btn gris" data-color="gris" data-nombre="Otros"></button>
                    </div>

                    <span id="color-label" class="color-label">Selecciona una etiqueta</span>

                </div>

                <input type="hidden" id="color">
            </div>

            <div class="form-group">
                <label>Carpeta</label>
                <select id="task-folder">
                    <option value="Todas">Sin carpeta</option>
                    <option value="Trabajo">Trabajo</option>
                    <option value="Personal">Personal</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="fecha" min="">
            </div>


            <div class="modal-buttons">
                <button type="button" class="btn-cancelar">Cancelar</button>
                <button type="submit" class="btn-crear" id="btnGuardar" disabled>Crear tarea</button>
            </div>

        </form>

    </div>

</div>


<div class="modal-overlay" id="modalEliminar">

    <div class="modal modal-delete">

        <div class="modal-header">
            <h2 id="deleteTitle">Eliminar tarea</h2>
            <button class="modal-close" id="cerrarEliminar">✕</button>
        </div>

        <div class="delete-icon">⚠</div>

        <p class="delete-text">
            ¿Estás seguro de que deseas eliminar esta tarea?
            <br>
            <strong>Esta acción es irreversible.</strong>
        </p>

        <div class="modal-buttons">
            <button class="btn-cancelar" id="cancelarEliminar">Cancelar</button>
            <button class="btn-eliminar" id="confirmarEliminar">Eliminar</button>
        </div>

    </div>

</div>

<div id="toast-container"></div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
